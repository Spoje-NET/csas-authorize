# csas-authorize token expiration for Zabbix agent2 (package csas-authorize-zabbix)
UserParameter=csas.authorize.token.lld,/usr/bin/csas-zabbix-token discovery
UserParameter=csas.authorize.token.count,/usr/bin/csas-zabbix-token count
UserParameter=csas.authorize.token.refresh_days[*],/usr/bin/csas-zabbix-token refresh_days "$1"
UserParameter=csas.authorize.token.access_seconds[*],/usr/bin/csas-zabbix-token access_seconds "$1"
